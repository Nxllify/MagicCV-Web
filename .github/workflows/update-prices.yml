name: Update card prices

# Once a week it checks Scryfall's bulk prices against the saved web/data/prices.bin and only commits when the change is big
# (5 % of the priced cards moved by 10 % and 25 cents or more, or the saved prices are 30 days old). The old file is kept as
# prices.prev.bin so the site can show price changes. No big change means no commit. Scheduled workflows only run on the default branch.
on:
  schedule:
    - cron: "17 6 * * 1"      # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Write the new prices even if the change is small"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Scryfall bulk data and rebuild the price files
        run: python tools/update_prices.py ${{ inputs.force && '--force' || '' }}
      - name: Commit only if the files changed
        run: |
          git config user.name "magiccv-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/prices.bin web/data/prices.prev.bin web/data/prices.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update prices $(date -u +%F)"
          git push
