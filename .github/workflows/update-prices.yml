name: Update card prices

# Every day: refresh web/data/prices.bin from Scryfall bulk data and keep yesterday's file as prices.prev.bin
# (the site shows price changes from it). Scheduled workflows only run on the default branch.
on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC, a few hours after Scryfall refreshes its bulk files
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Scryfall bulk data and rebuild the price files
        run: python tools/update_prices.py
      - name: Commit if prices changed
        run: |
          git config user.name "magiccv-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/prices.bin web/data/prices.prev.bin web/data/prices.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update prices $(date -u +%F)"
          git push
