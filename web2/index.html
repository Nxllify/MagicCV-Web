<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>MagicCV</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322c55e'/%3E%3Ctext x='16' y='22' font-size='14' font-weight='700' text-anchor='middle' fill='%230f172a' font-family='monospace'%3EMC%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="fonts/FiraSans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/FiraSans-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
  <!-- installable app (Add to Home Screen): opens full screen, without the browser bars -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MagicCV">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- lets the model use several threads on GitHub Pages: adds the cross-origin-isolation headers and reloads once. Registered from the repo root so its scope also covers the shared model runtime under /web/ (a worker script outside the scope would be blocked). -->
  <script src="../coi-serviceworker.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <aside class="side" id="side" aria-label="Main"></aside>
    <div>
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main" tabindex="-1"></main>
      <footer class="legal">MagicCV is unofficial fan content. Card data and images are from <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>. Magic: The Gathering is a trademark of Wizards of the Coast. Your scans and camera frames stay in your browser.</footer>
    </div>
  </div>
  <nav class="bottomnav" id="bottomnav" aria-label="Main"></nav>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
  <noscript>MagicCV needs JavaScript.</noscript>
</body>
</html>
